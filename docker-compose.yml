services:
  backend:
    build:
      context: ./backend     
    container_name: laravel_backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "9000:9000"
    depends_on:
      - db
    command: php-fpm


  web:
    image: nginx:alpine
    container_name: nginx_web
    volumes:
      - ./backend:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    depends_on:
      - backend

  db:
    image: mysql:8
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: school_db
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel123
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
  # frontend:
  #   build:
  #     context: ./frontend
  #   container_name: react_frontend
  #   working_dir: /app
  #   volumes:
  #   - ./frontend:/app
  #   - frontend_node_modules:/app/node_modules

  #   ports:
  #     - "5173:5173"
  #   command: sh -c "npm install && npm run dev -- --host"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

volumes:
  dbdata:
